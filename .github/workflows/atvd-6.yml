name: Atvd 6 - Validacao e entrega

on:
  push:
    paths:
      - "atvd-6/**"
      - ".github/workflows/atvd-6.yml"

jobs:
  validar-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar HTML com HTMLHint
        working-directory: atvd-6
        run: npx --yes htmlhint@1.1.4 index.html

  validar-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar sintaxe CSS
        working-directory: atvd-6
        run: npx --yes prettier@3.6.2 --check styles.css

  preparar-entrega:
    runs-on: ubuntu-latest
    needs:
      - validar-html
      - validar-css
    steps:
      - uses: actions/checkout@v4
      - name: Criar pacote da entrega
        working-directory: atvd-6
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-atvd-6
          path: atvd-6/dist/
