name: Atvd 7 - GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "atvd-7/**"
      - ".github/workflows/atvd-7-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint HTML e verificar formato
        working-directory: atvd-7
        run: |
          npx --yes htmlhint@1.1.4 index.html
          npx --yes prettier@3.6.2 --check index.html styles.css

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Gerar pacote do site
        working-directory: atvd-7
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
          tar -czf site.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-bundle
          path: atvd-7/site.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-bundle
      - name: Procurar pasta dist
        run: |
          tar -xzf site.tar.gz
          if [ ! -d "dist" ]; then
            echo "::error::Directory 'dist/' not found in the downloaded build artifact."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
